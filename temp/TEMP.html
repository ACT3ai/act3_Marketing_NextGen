<style>
  /* ===== Tokens ===== */
  :root {
    --bg: #faf8f3;
    --bg-2: #f3efe5;
    --bg-3: #ebe5d6;
    --ink: #1a1714;
    --ink-2: #4a4540;
    --ink-3: #837c72;
    --line: #e2dccb;
    --line-2: #d4ccb6;
    --accent: #c4612b;
    --accent-ink: #ffffff;
    --accent-soft: #f3e2d2;
    --paper: #ffffff;

    --maxw: 1200px;
    --pad-x: clamp(20px, 4vw, 56px);
    --section-y: clamp(80px, 9vw, 140px);
    --radius: 8px;
    --radius-lg: 14px;

    --font-display: "Fraunces", "Times New Roman", serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  [data-aesthetic="cool"] {
    --bg: #ffffff;
    --bg-2: #f5f7fa;
    --bg-3: #eaeef4;
    --ink: #0f1419;
    --ink-2: #3a4452;
    --ink-3: #7a8594;
    --line: #e6ebf2;
    --line-2: #d3dae4;
    --accent-soft: #e8edff;
  }

  [data-aesthetic="editorial"] {
    --bg: #fafaf7;
    --bg-2: #f1f1ec;
    --bg-3: #e6e6df;
    --ink: #0a0a0a;
    --ink-2: #3a3a3a;
    --ink-3: #777772;
    --line: #e0e0d8;
    --line-2: #c8c8be;
    --accent-soft: #ececea;
  }

  [data-density="compact"] {
    --section-y: clamp(56px, 6vw, 96px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ===== Typography ===== */
  .serif { font-family: var(--font-display); font-feature-settings: "ss01", "ss02"; letter-spacing: -0.015em; }
  .mono  { font-family: var(--font-mono); }
  .label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .label--accent { color: var(--accent); }

  h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0; }

  /* ===== Layout ===== */
  .wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--pad-x); padding-right: var(--pad-x); }
  .section { padding-top: var(--section-y); padding-bottom: var(--section-y); position: relative; }
  .section--alt { background: var(--bg-2); }
  .section--paper { background: var(--paper); }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 22px;
    border-radius: 999px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14.5px;
    letter-spacing: -0.005em;
    cursor: pointer;
    border: 1px solid transparent;
    text-decoration: none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .2s ease;
    white-space: nowrap;
  }
  .btn--primary {
    background: var(--ink);
    color: var(--bg);
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.4);
  }
  .btn--primary:hover { background: var(--accent); color: var(--accent-ink); transform: translateY(-1px); }
  .btn--accent {
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 8px 24px -12px var(--accent);
  }
  .btn--accent:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn--ghost {
    background: transparent; color: var(--ink);
    border-color: var(--line-2);
  }
  .btn--ghost:hover { border-color: var(--ink); background: var(--bg-2); }
  .btn--sm { padding: 9px 16px; font-size: 13.5px; }
  .btn--lg { padding: 16px 28px; font-size: 15.5px; }
  .btn .arrow { display: inline-block; transition: transform .2s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ===== Section header common ===== */
  .sec-head { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; max-width: 720px; margin-bottom: 56px; }
  .sec-head--center { align-items: center; text-align: center; margin-left: auto; margin-right: auto; }
  .sec-head h2 { font-size: clamp(36px, 4.6vw, 60px); }
  .sec-head p { color: var(--ink-2); font-size: 18px; max-width: 56ch; }

  /* ===== Reveal ===== */
  body[data-loaded="true"] .reveal { opacity: 1; transform: none; }
  .reveal { opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .8s ease; }

  #tweaks-root { font-family: var(--font-body); }
  #app:empty::before {
    content: ""; position: fixed; inset: 0;
    background: var(--bg);
  }
</style>

<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;height:22px;
    border-radius:6px;cursor:default;padding:0}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setValue = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
  }, []);
  return { values, setValue };
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return (
    <>
      <div className="twk-sect">{title}</div>
      {children}
    </>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakRadio });
</script>

<script type="text/babel">
const NAV_VIDEO_TYPES = [
  { name: "Social Media", desc: "Vertical, fast, scroll-native" },
  { name: "Marketing", desc: "Brand films, ads, product" },
  { name: "Corporate", desc: "Town halls, training, comms" },

function Nav() {
  const [scrolled, setScrolled] = React.useState(false);
  const [openMenu, setOpenMenu] = React.useState(null);

function FlipCube({ words = ["Movies", "Videos"], interval = 6000 }) {
  const [idx, setIdx] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setIdx((i) => i + 1), interval);
    return () => clearInterval(id);
  }, [interval]);

  const cur = words[idx % words.length];
  const nxt = words[(idx + 1) % words.length];

  return (
    <span className="flipcube" aria-label={cur}>
      <span className="flipcube__sizer" aria-hidden="true">
        {words.map((w) => <span key={w} className="flipcube__sizer-w">{w}</span>)}
      </span>
      <span className="flipcube__stage" aria-hidden="true">
        <span className="flipcube__cube" key={idx}>
          <span className="flipcube__face flipcube__face--top">{cur}</span>
          <span className="flipcube__face flipcube__face--front">{nxt}</span>
        </span>
      </span>
      <style>{`
        .flipcube { position: relative; display: inline-block; vertical-align: baseline; font-style: italic; line-height: 1; }
        .flipcube__sizer { display: inline-grid; visibility: hidden; }
        .flipcube__sizer-w { grid-area: 1 / 1; padding: 0.06em 0.18em; }
        .flipcube__stage { position: absolute; inset: 0; perspective: 1400px; }
        .flipcube__cube { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 100% 0; animation: flipcube-roll 6s cubic-bezier(.7,.04,.22,1) infinite; will-change: transform; }
        .flipcube__face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0.06em 0.18em; color: #1a1714; background: linear-gradient(165deg, #ffffff 0%, #f4f2ed 55%, #d9d6cd 100%); border-radius: 0.05em; box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 0 rgba(0,0,0,.07), 0 18px 36px -22px rgba(0,0,0,.45), 0 4px 10px -6px rgba(0,0,0,.25); backface-visibility: hidden; -webkit-backface-visibility: hidden; font-style: italic; }
        .flipcube__face--top { transform: translateY(-50%) rotateX(90deg); transform-origin: 50% 100%; }
        .flipcube__face--front { transform: rotateY(0deg); }
        @keyframes flipcube-roll { 0%, 83% { transform: rotateX(0deg); } 100% { transform: rotateX(-90deg); } }
      `}</style>
    </span>
  );
}

      yt: <path d="M3 7c0-1.5 1-2 2-2h14c1 0 2 .5 2 2v10c0 1.5-1 2-2 2H5c-1 0-2-.5-2-2V7zm7 1.5v7l6-3.5-6-3.5z" fill="currentColor" />,
      ln: <><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" strokeWidth="1.6" /><path d="M7 10v7M7 7v.01M11 10v7M11 13c0-2 1.5-3 3-3s3 1 3 3v4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" /></>,
      ig: <><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" strokeWidth="1.6" /><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" strokeWidth="1.6" /><circle cx="17" cy="7" r="1" fill="currentColor" /></>,
    };
    return <svg width="18" height="18" viewBox="0 0 24 24" fill="none">{paths[kind]}</svg>;
  };
  return (
    <footer className="footer">
      <div className="wrap">
        <div className="footer__top">
          <div className="footer__brand">
            <Logo size={26} />
            <p className="footer__tag">Create movies at the speed of storytelling.</p>
            <a className="btn btn--accent btn--sm" href="#start">Start Free <span className="arrow">→</span></a>
          </div>
          <div className="footer__cols">
            {cols.map((c) => (
              <div className="footer__col" key={c.h}>
                <div className="footer__head">{c.h}</div>
                <ul>
                  {c.links.map((l) => <li key={l}><a href="#">{l}</a></li>)}
                </ul>
              </div>
            ))}
          </div>
        </div>
        <div className="footer__bot">
          <div className="footer__copy">© 2026 ACT 3 AI. All rights reserved.</div>
          <div className="footer__social">
            <a href="#" aria-label="X / Twitter"><SocialIcon kind="x" /></a>
            <a href="#" aria-label="YouTube"><SocialIcon kind="yt" /></a>
            <a href="#" aria-label="LinkedIn"><SocialIcon kind="ln" /></a>
            <a href="#" aria-label="Instagram"><SocialIcon kind="ig" /></a>
          </div>
        </div>
      </div>
      <style>{`
        .footer { padding: 80px 0 40px; border-top: 1px solid var(--line); }
        .footer__top { display: grid; grid-template-columns: 1.2fr 2.4fr; gap: clamp(32px, 5vw, 80px); }
        .footer__tag { color: var(--ink-2); margin: 18px 0 22px; max-width: 30ch; }
        .footer__cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .footer__head { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 14px; letter-spacing: -0.005em; }
        .footer__col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .footer__col a { color: var(--ink-2); text-decoration: none; font-size: 14px; transition: color .15s ease; }
        .footer__col a:hover { color: var(--accent); }
        .footer__bot { display: flex; align-items: center; justify-content: space-between; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
        .footer__social { display: flex; gap: 6px; }
        .footer__social a { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); transition: color .15s ease, border-color .15s ease, background .15s ease; }
        .footer__social a:hover { color: var(--accent); border-color: var(--accent); background: var(--bg-2); }
        @media (max-width: 900px) {
          .footer__top { grid-template-columns: 1fr; }
          .footer__cols { grid-template-columns: 1fr 1fr; }
        }
      `}</style>
    </footer>
  );
}

Object.assign(window, { Testimonials, FinalCTA, Footer });
</script>

<!-- app -->
<script type="text/babel">
const ACCENTS = {
  amber:  { name:"Amber",  hex:"#c4612b", soft:"#f3e2d2" },
  rust:   { name:"Rust",   hex:"#a64a2c", soft:"#efd9cd" },
  ink:    { name:"Ink",    hex:"#1a1a1a", soft:"#ececea" },
  forest: { name:"Forest", hex:"#1f6f4a", soft:"#d8ebe2" },
  violet: { name:"Violet", hex:"#6b42c2", soft:"#e6dcf5" },
  cobalt: { name:"Cobalt", hex:"#2956b8", soft:"#dce5f5" },
};

function App() {
  const { values, setValue } = window.useTweaks(window.TWEAK_DEFAULTS);

  React.useEffect(() => {
    const root = document.documentElement;
    root.dataset.aesthetic = values.aesthetic;
    root.dataset.density = values.density;
    const a = ACCENTS[values.accent] || ACCENTS.amber;
    root.style.setProperty("--accent", a.hex);
    root.style.setProperty("--accent-soft", a.soft);
    root.style.setProperty("--accent-ink", values.accent === "ink" ? "#faf8f3" : "#ffffff");
  }, [values.aesthetic, values.accent, values.density]);

  React.useEffect(() => { document.body.dataset.loaded = "true"; }, []);

  return (
    <>
      <Nav />
      <Hero />
      {values.showStats && <Stats />}
      <HowItWorks />
      <ValueRows />
      <VisualStyles />
      {values.showCrew && <Crew />}
      {values.showMath && <TheMath />}
      <Compare />
      <Pricing />
      <Testimonials />
      <FinalCTA />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Aesthetic">
          <TweakRadio
            label="Tone"
            value={values.aesthetic}
            options={[
              { value: "warm", label: "Warm" },
              { value: "cool", label: "Cool" },
              { value: "editorial", label: "Editorial" },
            ]}
            onChange={(v) => setValue("aesthetic", v)}
          />
        </TweakSection>

        <TweakSection title="Accent">
          <div className="accent-swatches">
            {Object.entries(ACCENTS).map(([k, a]) => (
              <button
                key={k}
                className={"accent-swatch " + (values.accent === k ? "is-on" : "")}
                onClick={() => setValue("accent", k)}
                aria-label={a.name}
                title={a.name}
              >
                <span style={{ background: a.hex }} />
                <span className="accent-swatch__name">{a.name}</span>
              </button>
            ))}
          </div>
        </TweakSection>

        <TweakSection title="Density">
          <TweakRadio
            label="Spacing"
            value={values.density}
            options={[
              { value: "spacious", label: "Spacious" },
              { value: "compact",  label: "Compact" },
            ]}
            onChange={(v) => setValue("density", v)}
          />
        </TweakSection>

        <TweakSection title="Sections">
          <TweakToggle label="Show Stats Bar" value={values.showStats} onChange={(v) => setValue("showStats", v)} />
          <TweakToggle label="Show AI Crew" value={values.showCrew} onChange={(v) => setValue("showCrew", v)} />
          <TweakToggle label="Show The Math" value={values.showMath} onChange={(v) => setValue("showMath", v)} />
        </TweakSection>
      </TweaksPanel>

      <style>{`
        .accent-swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .accent-swatch { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
        .accent-swatch > span:first-child { width: 100%; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
        .accent-swatch__name { font-size: 11px; color: var(--ink-2); }
        .accent-swatch:hover { border-color: var(--ink); }
        .accent-swatch.is-on { border-color: var(--ink); background: var(--bg-2); }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

</body>
</html>
